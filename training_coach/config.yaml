name: Training Coach
version: "2026.08.23"
slug: training_coach
description: "Morning training recommendation from Oura, Garmin, and Strava."
arch:
  - amd64
  - aarch64
  - armv7
startup: services
boot: auto
init: false
homeassistant_api: true
map:
  - addon_config:rw
options:
  timezone: "Europe/Helsinki"
  run_time: "07:30"
  oura_wait_minutes: 90
  poll_seconds: 60
  notify_service: "notify.tg_oskari"
  run_immediately_on_start: true
  strava_entity_prefix: "sensor.strava_oskari_vuorinen"
  weekly_long_runs: 1
  weekly_quality_runs: 1
  weekly_strength: 2
  weekly_rest_days: 1
  long_run_min_minutes: 75
schema:
  timezone: str
  run_time: str
  oura_wait_minutes: int
  poll_seconds: int
  notify_service: str
  run_immediately_on_start: bool
  strava_entity_prefix: str
  weekly_long_runs: int
  weekly_quality_runs: int
  weekly_strength: int
  weekly_rest_days: int
  long_run_min_minutes: int
