name: Training Coach
version: "2026.09.13"
slug: training_coach
description: "Morning and evening training coach from Oura, Garmin, and Strava, with live race prefs and Telegram."
arch:
  - amd64
  - aarch64
startup: services
boot: auto
init: false
stdin: true
homeassistant_api: true
map:
  - addon_config:rw
options:
  timezone: "Europe/Helsinki"
  run_time: "07:30"
  evening_time: "20:30"
  oura_wait_minutes: 90
  poll_seconds: 60
  notify_service: "notify.tg_oskari"
  mobile_notify_service: "notify.mobile_app_galaxys26"
  run_immediately_on_start: true
  strava_entity_prefix: "sensor.strava_oskari_vuorinen"
  long_run_min_minutes: 75
schema:
  timezone: str
  run_time: str
  evening_time: str
  oura_wait_minutes: int
  poll_seconds: int
  notify_service: str
  mobile_notify_service: str?
  run_immediately_on_start: bool
  strava_entity_prefix: str
  long_run_min_minutes: int
