[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "training-coach-core"
version = "0.1.0"
description = "Shared running-coach rules for the API, web, Android, and later Home Assistant."
requires-python = ">=3.11"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]
