# PR gate for the add-on monorepo.
# Protect main so this workflow is required: feature branches only, no direct pushes.
# GitHub (not this workflow) merges the PR after checks pass. A successful run
# dispatches addon-tag.yml. A merge by the Actions token does not emit
# pull_request closed, and workflow_dispatch is the event that token is allowed
# to start.
name: Add-on CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: addon-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch origin "${{ github.base_ref }}"

      - name: Test CI helpers
        run: python3 .github/scripts/test_addon_ci.py -v

      - name: Check version bumps
        run: python3 .github/scripts/addon_ci.py check

      - name: Run add-on tests
        run: python3 .github/scripts/addon_ci.py test

      - name: Start add-on tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch origin main
          if ! git grep -q 'workflow_dispatch:' origin/main:.github/workflows/addon-tag.yml; then
            echo "Add-on tag on main has no workflow_dispatch yet."
            exit 0
          fi
          gh workflow run addon-tag.yml --ref main -f pr_number="${{ github.event.pull_request.number }}"
